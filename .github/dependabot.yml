version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: dev

  - package-ecosystem: nuget
    directory: /src/dotnet
    schedule:
      interval: weekly
    target-branch: dev
