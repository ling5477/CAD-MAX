name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cad-max
  cancel-in-progress: false

jobs:
  governance:
    name: Governance
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check changed-file whitespace
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          }
          elseif ('${{ github.event_name }}' -eq 'push' -and
                  '${{ github.event.before }}' -ne '0000000000000000000000000000000000000000') {
            git diff --check '${{ github.event.before }}' '${{ github.sha }}'
          }
          else {
            git show --check --pretty=format: HEAD
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify documentation governance
        shell: pwsh
        run: ./scripts/docs/verify-docs.ps1

      - name: Verify AutoCAD script safety boundaries
        shell: pwsh
        run: ./scripts/autocad/Test-AutoCADScripts.ps1

  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/python

      - name: Pytest
        run: uv run pytest

      - name: Doctor smoke
        run: uv run cad-max-mcp doctor

  dotnet:
    name: .NET 8
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: src/dotnet/**/packages.lock.json

      - name: Restore
        run: dotnet restore src/dotnet/CadMax.sln --locked-mode --configfile NuGet.Config

      - name: Build
        run: dotnet build src/dotnet/CadMax.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/dotnet/CadMax.sln --configuration Release --no-build
